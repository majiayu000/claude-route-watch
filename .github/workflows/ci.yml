name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: claude-route-watch --help
        working-directory: ${{ runner.temp }}
      - run: python scripts/build-terminal.py
      - run: python dist/claude-route-watch.pyz --help
      - run: sh dist/claude-route-watch.sh --help
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/Claude-Route-Watch-terminal.zip
            dist/claude-route-watch.pyz
            dist/claude-route-watch.sh
            dist/SHA256SUMS
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[desktop]' pyinstaller==6.22.3
      - run: python scripts/build-desktop.py
      - run: codesign --verify --deep --strict 'dist/Claude Route Watch.app'
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-desktop-preview
          path: dist/Claude-Route-Watch-macOS-*.zip
